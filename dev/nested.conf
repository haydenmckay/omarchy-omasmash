# Hyprland config for the nested test compositor.
#
# The point of running nested: ext-session-lock-v1 is enforced by whichever
# compositor holds the lock. Inside here, a stranded lock strands *this
# window*, which can be closed. On the real session it would strand the
# machine. Every lock/crash/kill -9 test belongs in here first.

monitor = , 1600x900@60, 0x0, 1

exec-once = quickshell -p __PROJECT__/dev-shell.qml

general {
  border_size = 2
  gaps_in = 4
  gaps_out = 8
}

decoration {
  rounding = 6
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}

# Escape hatches inside the nested session.
bind = SUPER SHIFT, E, exit
bind = SUPER, T, exec, alacritty
