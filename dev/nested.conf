# Hyprland config for the nested test compositor.
#
# The point of running nested: ext-session-lock-v1 is enforced by whichever
# compositor holds the lock. Inside here, a stranded lock strands *this
# window*, which can be closed. On the real session it would strand the
# machine. Every lock/crash/kill -9 test belongs in here first.

monitor = , 1600x900@60, 0x0, 1

exec-once = quickshell -p __PROJECT__/dev-shell.qml

# Give the nested session something behind the lock. An empty compositor shows
# a blank screen after unlock, which reads as a hang -- with a terminal here,
# unlock visibly reveals it, which is a much better test signal.
exec-once = alacritty

general {
  border_size = 2
  gaps_in = 4
  gaps_out = 8
}

decoration {
  rounding = 6
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0

  # MUST mirror Omarchy's real session (default/hypr/looknfeel.lua sets this
  # true). Without it, Hyprland refuses a lock request while a stranded lock
  # is held and kills the asking client with a fatal Wayland protocol error --
  # so recovery can never complete and the session is locked forever. Leaving
  # it out reproduces a lockout that the real environment does not have.
  allow_session_lock_restore = true
}

# Escape hatches inside the nested session.
bind = SUPER SHIFT, E, exit
bind = SUPER, T, exec, alacritty
